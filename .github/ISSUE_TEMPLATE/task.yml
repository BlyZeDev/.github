name: Task
description: Maintenance, refactoring or other work item
type: "📝 Task"
assignees:
  - BlyZeDev
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How do we know this is finished?
      value: "- [ ] ...\n- [ ] ..."
    validations:
      required: false

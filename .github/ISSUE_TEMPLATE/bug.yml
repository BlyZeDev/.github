name: Bug Report
description: Report something that isn't working
type: "🐞 Bug"
assignees:
  - BlyZeDev
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this has not been reported yet
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe it as detailed as possible. What did you expect to happen instead?
      value: "Steps to reproduce:\n\n1. Use this...\n2. Then do this...\n3. Error happens!"
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error / logs
      description: Paste any error message or stack trace
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version(s)
      placeholder: Separate versions with ;
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, environment, or anything else that could be useful
    validations:
      required: false

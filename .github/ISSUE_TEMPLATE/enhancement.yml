name: Enhancement suggestion
description: Feature request or improvement idea
type: "💡 Enhancement"
assignees:
  - BlyZeDev
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this has not been suggested yet
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do that is hard or impossible right now?
    validations:
      required: false
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: Specify your idea as detailed as possible
      placeholder: I would really like if...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds or other solutions you considered
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context that could be useful
    validations:
      required: false
